global:
  resolve_timeout: 5m

route:
  receiver: 'slack_notifications'
  routes:
    - receiver: 'pagerduty'
      match:
        severity: 'critical'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: 'slack_notifications'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts'
        title: '{{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}*{{ .Annotations.summary }}*\n{{ .Annotations.description }}\n{{ end }}'

  - name: 'pagerduty'
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY}'
        severity: '{{ .CommonLabels.severity }}'
        details:
          runbook: 'See runbook in docs/DEPLOYMENT.md'

  - name: 'pagerduty_mock'
    webhook_configs:
      - url: '${MOCK_PAGERDUTY_URL}'
        send_resolved: true

inhibit_rules: []
