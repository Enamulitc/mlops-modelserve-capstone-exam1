name: CD — Build, Push & Deploy

on:
  push:
    branches: ["main"]

env:
  AWS_REGION:      ap-southeast-1
  ECR_REGISTRY:    242799976997.dkr.ecr.ap-southeast-1.amazonaws.com
  ECR_REPOSITORY:  modelserve/proddetection

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Run tests
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run unit tests
        run: pytest app/tests/ -v --cov=app --cov-report=term-missing

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Build and push to ECR
  # ──────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }}

      - name: Build, tag, and push image
        id: build
        run: |
          IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          LATEST_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

          docker build -t $IMAGE_URI -t $LATEST_URI .
          docker push $IMAGE_URI
          docker push $LATEST_URI

          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: SSH deploy to EC2
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/mlops-modelserve-capstone-exam1

            git pull origin main

            # Login to ECR using EC2 instance role (no keys needed on server)
            aws ecr get-login-password --region ap-southeast-1 | \
              docker login --username AWS --password-stdin \
              242799976997.dkr.ecr.ap-southeast-1.amazonaws.com

            # Pull and restart api only
            export API_IMAGE=${{ needs.build-and-push.outputs.image_uri }}
            docker pull $API_IMAGE
            API_IMAGE=$API_IMAGE docker compose up -d --no-deps api

      - name: Verify health endpoint
        run: |
          sleep 20
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://${{ secrets.DEPLOY_HOST }}:8000/health) || true
            [ "$STATUS" = "200" ] && echo "API is healthy" && exit 0
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed" && exit 1
