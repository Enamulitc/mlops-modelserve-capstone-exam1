name: Optional Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # optional scheduled nightly run (can be removed)

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    if: ${{ secrets.DEPLOY_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run smoke test against deployed URL
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          python scripts/smoke_test.py --url "${DEPLOY_URL}"
