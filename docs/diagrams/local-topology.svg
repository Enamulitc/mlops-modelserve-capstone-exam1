<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #334155; }
      .boxTitle { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 500 14px Arial, sans-serif; fill: #1e293b; }
      .legend { font: 500 14px Arial, sans-serif; fill: #0f172a; }
      .stepLabel { font: 700 14px Arial, sans-serif; fill: #ffffff; }
      .stepText { font: 600 14px Arial, sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="860" fill="#f8fafc"/>
  <text x="40" y="52" class="title">Local Development Topology (Numbered Flow)</text>
  <text x="40" y="80" class="subtitle">ModelServe · FastAPI + MLflow + Feast + Redis + Prometheus + Grafana on Docker Compose</text>

  <rect x="40" y="110" width="1320" height="540" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="60" y="142" class="boxTitle">Developer Machine / Poridhi VM</text>

  <rect x="80" y="190" width="190" height="90" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="102" y="224" class="boxTitle">Client</text>
  <text x="102" y="246" class="boxText">curl / tests</text>

  <rect x="330" y="170" width="210" height="110" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="352" y="205" class="boxTitle">FastAPI API</text>
  <text x="352" y="227" class="boxText">:8000</text>
  <text x="352" y="249" class="boxText">/health /predict /metrics</text>

  <rect x="630" y="170" width="210" height="110" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="652" y="205" class="boxTitle">MLflow</text>
  <text x="652" y="227" class="boxText">:5000</text>
  <text x="652" y="249" class="boxText">Model Registry</text>

  <rect x="930" y="170" width="210" height="110" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="952" y="205" class="boxTitle">PostgreSQL</text>
  <text x="952" y="227" class="boxText">:5432</text>
  <text x="952" y="249" class="boxText">MLflow backend DB</text>

  <rect x="500" y="340" width="200" height="110" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="522" y="375" class="boxTitle">Feast SDK</text>
  <text x="522" y="397" class="boxText">Feature lookup layer</text>
  <text x="522" y="419" class="boxText">in app.feature_client</text>

  <rect x="780" y="340" width="200" height="110" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="802" y="375" class="boxTitle">Redis</text>
  <text x="802" y="397" class="boxText">:6379</text>
  <text x="802" y="419" class="boxText">Feast online store</text>

  <rect x="330" y="500" width="210" height="110" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="352" y="535" class="boxTitle">Prometheus</text>
  <text x="352" y="557" class="boxText">:9090</text>
  <text x="352" y="579" class="boxText">Scrapes /metrics</text>

  <rect x="630" y="500" width="210" height="110" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="652" y="535" class="boxTitle">Grafana</text>
  <text x="652" y="557" class="boxText">:3000</text>
  <text x="652" y="579" class="boxText">Dashboards + Alerts</text>

  <!-- Arrows -->
  <line x1="270" y1="230" x2="330" y2="230" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="540" y1="205" x2="630" y2="205" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="840" y1="205" x2="930" y2="205" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="430" y1="280" x2="560" y2="340" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="395" x2="780" y2="395" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="430" y1="280" x2="430" y2="500" stroke="#475569" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="540" y1="555" x2="630" y2="555" stroke="#475569" stroke-width="3" marker-end="url(#arrowGray)"/>

  <!-- Numbered steps circles -->
  <circle cx="300" cy="210" r="16" fill="#2563eb"/><text x="294" y="215" class="stepLabel">1</text>
  <circle cx="585" cy="188" r="16" fill="#2563eb"/><text x="579" y="193" class="stepLabel">2</text>
  <circle cx="870" cy="188" r="16" fill="#2563eb"/><text x="864" y="193" class="stepLabel">3</text>
  <circle cx="490" cy="318" r="16" fill="#2563eb"/><text x="484" y="323" class="stepLabel">4</text>
  <circle cx="740" cy="375" r="16" fill="#2563eb"/><text x="734" y="380" class="stepLabel">5</text>
  <circle cx="450" cy="470" r="16" fill="#475569"/><text x="444" y="475" class="stepLabel">6</text>
  <circle cx="585" cy="535" r="16" fill="#475569"/><text x="579" y="540" class="stepLabel">7</text>

  <!-- Legend -->
  <rect x="40" y="680" width="1320" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="710" class="boxTitle">How it works (numbered)</text>
  <text x="60" y="735" class="legend">1) Client sends POST /predict to FastAPI.</text>
  <text x="60" y="757" class="legend">2) FastAPI loads current Production model metadata from MLflow.</text>
  <text x="60" y="779" class="legend">3) MLflow uses PostgreSQL backend store for model/version metadata.</text>
  <text x="700" y="735" class="legend">4) FastAPI calls Feast SDK for online feature lookup.</text>
  <text x="700" y="757" class="legend">5) Feast fetches entity features from Redis online store.</text>
  <text x="700" y="779" class="legend">6) FastAPI exposes /metrics; Prometheus scrapes it.</text>
  <text x="700" y="801" class="legend">7) Grafana visualizes Prometheus metrics and alerts.</text>
</svg>
