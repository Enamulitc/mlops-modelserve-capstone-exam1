<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #334155; }
      .boxTitle { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 500 14px Arial, sans-serif; fill: #1e293b; }
      .legend { font: 500 14px Arial, sans-serif; fill: #0f172a; }
      .stepLabel { font: 700 14px Arial, sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="#f8fafc"/>
  <text x="40" y="52" class="title">Production Topology (Single EC2) — Numbered End-to-End Flow</text>
  <text x="40" y="80" class="subtitle">Git push → GitHub Actions → ECR → EC2 deployment → Live inference + monitoring</text>

  <!-- GitHub + CI/CD -->
  <rect x="40" y="120" width="700" height="250" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="60" y="150" class="boxTitle">GitHub</text>
  <rect x="60" y="170" width="220" height="80" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="80" y="202" class="boxTitle">Repository</text>
  <text x="80" y="224" class="boxText">main branch</text>

  <rect x="320" y="170" width="390" height="170" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="340" y="202" class="boxTitle">GitHub Actions: deploy.yml</text>
  <text x="340" y="226" class="boxText">Job [2] test (pytest)</text>
  <text x="340" y="248" class="boxText">Job [3] build-and-push (docker build/push)</text>
  <text x="340" y="270" class="boxText">Job [4] deploy (SSH + docker compose up -d api)</text>

  <!-- AWS services -->
  <rect x="780" y="120" width="780" height="640" rx="14" fill="#ecfeff" stroke="#a5f3fc" stroke-width="2"/>
  <text x="800" y="150" class="boxTitle">AWS (ap-southeast-1)</text>

  <rect x="810" y="180" width="260" height="120" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="830" y="212" class="boxTitle">ECR</text>
  <text x="830" y="234" class="boxText">modelserve/proddetection</text>
  <text x="830" y="256" class="boxText">Docker image registry</text>

  <rect x="1110" y="180" width="260" height="120" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="1130" y="212" class="boxTitle">S3</text>
  <text x="1130" y="234" class="boxText">MLflow artifacts</text>
  <text x="1130" y="256" class="boxText">Feast offline parquet</text>

  <rect x="810" y="330" width="720" height="400" rx="12" fill="#ffffff" stroke="#64748b"/>
  <text x="830" y="360" class="boxTitle">EC2 t3.small (Elastic IP) — Docker Compose stack</text>

  <rect x="840" y="390" width="180" height="90" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="860" y="422" class="boxTitle">FastAPI</text>
  <text x="860" y="444" class="boxText">:8000</text>

  <rect x="1050" y="390" width="180" height="90" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="1070" y="422" class="boxTitle">MLflow</text>
  <text x="1070" y="444" class="boxText">:5000</text>

  <rect x="1260" y="390" width="180" height="90" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="1280" y="422" class="boxTitle">PostgreSQL</text>
  <text x="1280" y="444" class="boxText">:5432</text>

  <rect x="945" y="520" width="180" height="90" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="965" y="552" class="boxTitle">Feast SDK</text>
  <text x="965" y="574" class="boxText">Online lookup</text>

  <rect x="1155" y="520" width="180" height="90" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="1175" y="552" class="boxTitle">Redis</text>
  <text x="1175" y="574" class="boxText">:6379 (online)</text>

  <rect x="840" y="630" width="180" height="80" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="860" y="660" class="boxTitle">Prometheus</text>
  <text x="860" y="682" class="boxText">:9090</text>

  <rect x="1050" y="630" width="180" height="80" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="1070" y="660" class="boxTitle">Grafana</text>
  <text x="1070" y="682" class="boxText">:3000</text>

  <!-- arrows -->
  <line x1="280" y1="210" x2="320" y2="210" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="710" y1="250" x2="810" y2="240" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="710" y1="290" x2="840" y2="435" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="1020" y1="435" x2="1050" y2="435" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1230" y1="435" x2="1260" y2="435" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="930" y1="480" x2="1010" y2="520" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1125" y1="565" x2="1155" y2="565" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="1110" y1="300" x2="1120" y2="390" stroke="#475569" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="930" y1="480" x2="930" y2="630" stroke="#475569" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="1020" y1="670" x2="1050" y2="670" stroke="#475569" stroke-width="3" marker-end="url(#arrowGray)"/>

  <!-- Step circles -->
  <circle cx="300" cy="188" r="16" fill="#2563eb"/><text x="294" y="193" class="stepLabel">1</text>
  <circle cx="300" cy="245" r="16" fill="#2563eb"/><text x="294" y="250" class="stepLabel">2</text>
  <circle cx="760" cy="228" r="16" fill="#2563eb"/><text x="754" y="233" class="stepLabel">3</text>
  <circle cx="770" cy="305" r="16" fill="#2563eb"/><text x="764" y="310" class="stepLabel">4</text>
  <circle cx="1035" cy="416" r="16" fill="#2563eb"/><text x="1029" y="421" class="stepLabel">5</text>
  <circle cx="1220" cy="416" r="16" fill="#2563eb"/><text x="1214" y="421" class="stepLabel">6</text>
  <circle cx="1070" cy="542" r="16" fill="#2563eb"/><text x="1064" y="547" class="stepLabel">7</text>
  <circle cx="1140" cy="545" r="16" fill="#2563eb"/><text x="1134" y="550" class="stepLabel">8</text>
  <circle cx="1120" cy="355" r="16" fill="#475569"/><text x="1114" y="360" class="stepLabel">9</text>
  <circle cx="930" cy="610" r="16" fill="#475569"/><text x="924" y="615" class="stepLabel">10</text>
  <circle cx="1035" cy="652" r="16" fill="#475569"/><text x="1028" y="657" class="stepLabel">11</text>

  <!-- Legend -->
  <rect x="40" y="790" width="1520" height="160" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="822" class="boxTitle">How it works (numbered)</text>
  <text x="60" y="846" class="legend">1) Developer pushes code to main. 2) CI test job runs pytest.</text>
  <text x="60" y="868" class="legend">3) build-and-push job builds image and pushes to ECR. 4) deploy job SSHs into EC2 and updates api container.</text>
  <text x="60" y="890" class="legend">5) FastAPI starts and loads Production model from MLflow. 6) MLflow reads metadata from PostgreSQL.</text>
  <text x="60" y="912" class="legend">7) FastAPI calls Feast SDK. 8) Feast fetches features from Redis online store.</text>
  <text x="820" y="846" class="legend">9) MLflow stores artifacts in S3. 10) Prometheus scrapes /metrics from FastAPI.</text>
  <text x="820" y="868" class="legend">11) Grafana reads Prometheus data for dashboards + alerts.</text>
</svg>
